<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfólio</title>
<meta name="theme-color" content="#775FB8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#775FB8;--secondary:#2C2F33;--p-d:color-mix(in srgb,var(--primary) 80%,#000);
--bg:color-mix(in srgb,var(--secondary) 55%,#000);--card:var(--secondary);--ink:#eceaf3;--muted:#a3a3b2;--line:color-mix(in srgb,var(--secondary) 70%,#fff 12%);

*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font:400 17px/1.65 var(--body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit}[hidden]{display:none!important}

.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--head);letter-spacing:-.03em;line-height:1.1}
h1{font-size:clamp(2.5rem,5.6vw,4.3rem)}h2{font-size:clamp(1.9rem,3.8vw,2.6rem)}h3{font-size:1.2rem;font-weight:600}
.lead{font-size:1.15rem;color:var(--muted);max-width:54ch}
section{padding:80px 0}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:12px}
.brand{text-decoration:none;font:700 1.3rem var(--head);letter-spacing:-.03em}
.nr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border-radius:14px;font:600 1rem var(--body);text-decoration:none;border:1.5px solid transparent;cursor:pointer;color:var(--ink);background:none;transition:transform .15s,background .15s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-main{background:var(--primary);color:#fff;box-shadow:0 8px 20px -8px var(--primary)}.btn-main:hover:not(:disabled){background:var(--p-d)}
.btn-line{border-color:var(--line)}.btn-line:hover{border-color:var(--primary)}
.btn-sm{min-height:40px;padding:0 16px;font-size:.92rem;border-radius:11px}
.btn svg{width:18px;height:18px;margin-right:8px}
.who{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px 0 5px;border-radius:11px;border:1.5px solid var(--line);background:none;color:var(--ink);font:600 .92rem var(--body);cursor:pointer}
.who img{width:28px;height:28px;border-radius:50%}
.hero{padding:88px 0 56px;background:radial-gradient(800px 380px at 85% 0,color-mix(in srgb,var(--primary) 22%,transparent),transparent 70%)}
.pill{display:inline-block;padding:6px 14px;border-radius:99px;background:color-mix(in srgb,var(--primary) 20%,transparent);color:#d9d0f5;font-weight:600;font-size:.9rem;margin-bottom:22px}
.hero h1 span{color:var(--primary)}.hero .lead{margin:22px 0 32px}.cta{display:flex;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;min-width:0}
.blk:hover{transform:translateY(-3px);box-shadow:0 20px 40px -24px #000}
.blk.plain{background:none;border-color:transparent}.blk.plain:hover{transform:none;box-shadow:none}
.blk img{width:100%;display:block;cursor:zoom-in;object-fit:cover}
.bd{padding:24px;display:flex;flex-direction:column;gap:10px;flex:1}
.bd p{color:var(--muted);font-size:.98rem}.bd.c{text-align:center;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:.85rem;font-weight:600;padding:3px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.pr{background:var(--primary);border-color:var(--primary);color:#fff;font:700 1rem var(--head);padding:3px 14px}

#gate{background:var(--primary);color:#fff;text-align:center;padding:10px 16px;font-weight:600;font-size:.93rem}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;display:grid;place-items:center;cursor:zoom-out;padding:16px}
#lb img{max-width:100%;max-height:100%;border-radius:12px}

.tabs{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--ink);font:600 .88rem var(--body);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--primary);border-color:var(--primary);color:#fff}
.ab{flex:1;overflow:auto;padding:18px;display:grid;gap:14px;align-content:start}
.fld{display:grid;gap:6px;font-size:.86rem;font-weight:600;color:var(--muted)}

.fld input[type=color]{padding:3px;height:44px}.fld.ck{display:flex;align-items:center;gap:10px}.fld.ck input{width:auto}
.item{border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;background:var(--bg)}
.ih{display:flex;justify-content:space-between;align-items:center;gap:8px}.ih span{display:flex;gap:6px}
.ih button{border:1px solid var(--line);background:var(--secondary);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;font:600 .8rem var(--body)}
.thumb{width:100%;max-height:150px;object-fit:cover;border-radius:10px}
.hint{font-size:.86rem;color:var(--muted)}
.af{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
#st{flex:1 0 100%;font-size:.84rem;font-weight:600;color:var(--muted)}#st.d{color:#f0b429}.af .btn-main{margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}td{padding:9px 5px;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--primary);color:#fff;padding:12px 20px;border-radius:12px;z-index:90;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}#toast.on{opacity:1}
@media(max-width:760px){section{padding:56px 0}.hero{padding:48px 0 32px}.blk{grid-column:span 12!important}.who span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:var(--mw,1160px)}.blk{border-radius:var(--r,24px)}.nav{height:auto;min-height:72px;padding:8px 0;flex-wrap:wrap}
.btn.on{background:var(--primary);border-color:var(--primary);color:#fff}.card{cursor:pointer}.card h3{font-size:1.35rem}
.pg{animation:pgin .4s ease both}@keyframes pgin{from{opacity:0;transform:translateY(10px)}}
</style>
</head>
<body>

<script type="module">
let ADMIN_EMAIL="",FIREBASE_CONFIG=null;

const GOOGLE='<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.7 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7A14.500 14.500 0 019.500 24c0-1.600.3-3.200.8-4.700l-7.800-6.100A24 24 0 000 24c0 3.900.9 7.500 2.600 10.800l7.800-6.100z"/><path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.500-5.800c-2.100 1.400-4.800 2.300-8.400 2.300-6.300 0-11.700-4.100-13.600-9.800l-7.800 6.100C6.500 42.600 14.600 48 24 48z"/></svg>';

/* fundos animados */
let starCol="119,95,184";
(()=>{const cv=$("#stars"),x=cv.getContext("2d"),still=matchMedia("(prefers-reduced-motion:reduce)").matches;let W,H,S=[],last="";

 S=Array.from({length:t==="rain"?Math.round(W/24*q):Math.min(300,Math.round(W*H/9000*q))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.4,v:Math.random()*.18+.03+(t==="rain"?.4:0),p:Math.random()*6.28,s:Math.random()*.002+.0006}))};

 if(T==="grid"){x.strokeStyle=`rgba(${c},.16)`;x.lineWidth=1;const g=56,o=(t*.02*sp)%g;x.beginPath();for(let i=-g;i<W+g;i+=g){x.moveTo(i+o,0);x.lineTo(i+o,H)}for(let j=-g;j<H+g;j+=g){x.moveTo(0,j+o);x.lineTo(W,j+o)}x.stroke();return}
 if(T==="aurora"){for(let k=0;k<3;k++){const px=W*(.5+.4*Math.sin(t*.0003*sp+k*2)),py=H*(.5+.35*Math.cos(t*.00025*sp+k*3)),r=Math.max(W,H)*.45,g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,`rgba(${c},.3)`);g.addColorStop(1,`rgba(${c},0)`);x.fillStyle=g;x.fillRect(0,0,W,H)}return}
 if(T==="waves"){for(let k=0;k<4;k++){x.fillStyle=`rgba(${c},${.07+k*.03})`;x.beginPath();x.moveTo(0,H);for(let i=0;i<=W;i+=12)x.lineTo(i,H*(.72+k*.07)+Math.sin(i*.006+t*.0008*sp+k*1.5)*24);x.lineTo(W,H);x.fill()}return}

  if(T==="rain"){if(!still){s.y+=s.v*3*sp;if(s.y-140>H){s.y=-20;s.x=Math.random()*W}}x.font="14px monospace";for(let k=0;k<8;k++){x.fillStyle=`rgba(${c},${(1-k/8)*.55})`;x.fillText((((s.y/16)|0)*3+k*5)%2,s.x,s.y-k*16)}continue}

  else if(T==="fireflies"){if(!still){s.x=(s.x+Math.cos(t*.0005+s.p)*.5*sp+W)%W;s.y=(s.y+Math.sin(t*.0004+s.p)*.5*sp+H)%H}x.shadowBlur=14;x.shadowColor=`rgb(${c})`;x.fillStyle=`rgba(${c},${a})`;x.beginPath();x.arc(s.x,s.y,s.r*2,0,6.283);x.fill();x.shadowBlur=0}
  else{if(!still){s.y-=s.v*sp;s.x+=s.v*.25*sp;if(s.y<-4){s.y=H+4;s.x=Math.random()*W}if(s.x>W+4)s.x=-4}x.fillStyle=`rgba(${c},${a})`;x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill()}}};
const loop=t=>{draw(t);requestAnimationFrame(loop)};addEventListener("resize",()=>starsTheme());size();still?draw(0):requestAnimationFrame(loop)})();

/* estado */
let cfg=clone(DEF),saved=clone(DEF),blocks=[],savedBlocks=[],prices={},user=null,me=null,fb=null,dirty=false,saving=false,touched=new Set,deleted=new Set,page="inicio",curCat=null,lastPage="";
const isAdmin=()=>{const e=(user?.email||"").toLowerCase();return !!user&&user.emailVerified&&[...ADMINS,String(ADMIN_EMAIL).toLowerCase()].includes(e)};
const approved=()=>isAdmin()||!!me?.approved;

const FONTS=["Sora","Figtree","Poppins","Playfair Display","Space Grotesk","Lora","Inter","Bebas Neue"];
function blk(b,i){
  const pv=prices[b.id]?.v,price=pv?`<span class="chip pr">${esc(pv)}</span>`:(b.hp?`<span class="chip">🔒 Preço para contas ativadas</span>`:"");
  const chips=(b.dims?`<span class="chip">${esc(b.dims)}</span>`:"")+price,hasT=b.title||b.text||chips||b.url;

  const c=cfg,st=document.documentElement.style,hf=FONTS.includes(c.hFont)?c.hFont:"Sora",bf=FONTS.includes(c.bFont)?c.bFont:"Figtree";

  if(page==="inicio")$("#view").innerHTML=`<section class="hero${an}"><div class="wrap"><span class="pill">${esc(c.tag)}</span><h1>${esc(c.title)} <span>${esc(c.hi)}</span></h1><p class="lead">${esc(c.lead)}</p><div class="cta">${btn(c.b1,c.u1,"btn-main")}${btn(c.b2,c.u2,"btn-line")}</div></div></section>`+(c.cards!==false&&ks.length?`<section class="${an}" style="padding-top:24px"><div class="wrap"><div class="grid">${ks.map(k=>`<a class="blk card" style="grid-column:span 4;text-decoration:none" href="#${esc(k.id)}"><div class="bd"><h3>${esc(k.name)}</h3><p>${esc(k.desc||"")}</p></div></a>`).join("")}</div></div></section>`:"");

function route(){const h=decodeURIComponent(location.hash.slice(1));
  if(h==="admin"){try{sessionStorage.setItem("adm","1")}catch(e){}renderAuth();return}
  if(h==="inicio"||cfg.cats.some(k=>k.id===h)){page=h;render();scrollTo(0,0)}else if(!h&&page!=="inicio"){page="inicio";render()}}
addEventListener("hashchange",route);
$("#view").addEventListener("click",e=>{const i=e.target.closest("img[data-i]");if(i){$("#lb img").src=i.src;$("#lb").hidden=false}});
$("#lb").onclick=()=>$("#lb").hidden=true;

/* Firebase */
const CDN="https://www.gstatic.com/firebasejs/10.12.2/";
async function loadPrices(){
  prices={};try{
    const q=approved()?fb.F.collection(fb.db,"pf_prices"):fb.F.query(fb.F.collection(fb.db,"pf_prices"),fb.F.where("pub","==",true));
    (await fb.F.getDocs(q)).forEach(d=>prices[d.id]=d.data());
  }catch(e){console.warn(e)}
  blocks.forEach(b=>{if(isAdmin()){b.price=prices[b.id]?.v||"";b.pub=prices[b.id]?.pub!==false}});
  savedBlocks=clone(blocks);
}
async function boot(){
  try{({ADMIN_EMAIL,FIREBASE_CONFIG}=await import("./firebase-config.js"))}catch(e){renderAuth();render();return}
  if(!FIREBASE_CONFIG||String(FIREBASE_CONFIG.apiKey).startsWith("COLE")){renderAuth();render();return}
  try{
    const [A,Au,F]=await Promise.all([import(CDN+"firebase-app.js"),import(CDN+"firebase-auth.js"),import(CDN+"firebase-firestore.js")]);
    const app=A.initializeApp(FIREBASE_CONFIG);fb={Au,F,auth:Au.getAuth(app),db:F.getFirestore(app)};
    try{const s=await F.getDoc(F.doc(fb.db,"portfolio","config"));if(s.exists()){cfg=norm(s.data());saved=clone(cfg)}}catch(e){}
    try{const s=await F.getDocs(F.collection(fb.db,"pf_blocks"));blocks=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.o||0)-(b.o||0)).map(b=>({...b,cat:b.cat||cfg.cats[0]?.id}));savedBlocks=clone(blocks)}catch(e){}
    await loadPrices();route();render();
    Au.onAuthStateChanged(fb.auth,async u=>{
      user=u;me=null;
      if(u){try{const r=F.doc(fb.db,"pf_users",u.uid),s=await F.getDoc(r),base={name:u.displayName||"",email:u.email||"",photo:u.photoURL||"",lastLogin:new Date().toISOString()};
        if(s.exists()){await F.setDoc(r,base,{merge:true});me=(await F.getDoc(r)).data()}else{await F.setDoc(r,{...base,approved:false});me={approved:false}}}catch(e){console.warn(e)}}
      else closeAdmin(true);
      await loadPrices();renderAuth();render();
    });
  }catch(e){console.error(e);renderAuth();render()}
}
const ss=()=>{try{return sessionStorage.getItem("adm")==="1"}catch(e){return false}};
const norm=d=>{const c={...DEF,...d};if(!Array.isArray(d.cats))c.cats=[{...DEF.cats[0]},{id:"sobre",name:"Sobre",title:d.aboutTitle||"Sobre mim",desc:"",text:d.about??DEF.cats[1].text,on:true}];return c};
function renderAuth(){
  const b=$("#auth");
  if(!user){b.innerHTML=cfg.loginOn!==false||ss()?`<button class="btn btn-main btn-sm" data-a="login">${GOOGLE}${esc(cfg.loginLabel||"Entrar com Google")}</button>`:"";return}
  const img=/^https?:/i.test(user.photoURL||"")?`<img src="${esc(user.photoURL)}" alt="" referrerpolicy="no-referrer">`:"";
  b.innerHTML=(isAdmin()?`<button class="btn btn-main btn-sm" data-a="admin">Painel admin</button>`:"")+`<button class="who" data-a="logout" title="Sair">${img}<span>Sair</span></button>`;
}
$("#auth").addEventListener("click",async e=>{
  const a=e.target.closest("[data-a]")?.dataset.a;
  if(a==="login"){if(!fb)return toast("Configure o firebase-config.js (veja o LEIA-ME).");
    const p=new fb.Au.GoogleAuthProvider();try{await fb.Au.signInWithPopup(fb.auth,p)}catch(er){if(er.code==="auth/popup-blocked")fb.Au.signInWithRedirect(fb.auth,p);else if(er.code==="auth/unauthorized-domain")toast("Domínio não autorizado no Firebase (Authentication > Settings).");else if(er.code!=="auth/popup-closed-by-user")toast("Erro no login: "+(er.code||er.message))}}
  if(a==="logout")fb.Au.signOut(fb.auth).then(()=>toast("Você saiu."));
  if(a==="admin")openAdmin();
});

/* painel admin */
const CK="ck",CL="cl",AR="ar",SEL="sel";
const SPANS=[[12,"Largura total"],[8,"2/3"],[6,"Metade"],[4,"1/3"],[3,"1/4"]];
const FO=FONTS.map(f=>[f,f]),BGS=[["stars","Estrelas"],["aurora","Aurora"],["bubbles","Bolhas"],["snow","Neve"],["fireflies","Vagalumes"],["rain","Chuva digital"],["grid","Grade em movimento"],["waves","Ondas"],["none","Nenhum"]],LVL=[[0.5,"Baixa"],[1,"Normal"],[2,"Alta"]];
const TABS=[
 {id:"visual",label:"Visual",fields:[["primary","Cor primária",CL],["secondary","Cor secundária (fundo e cartões)",CL],["ink","Cor do texto",CL],["hFont","Fonte dos títulos",SEL,FO],["bFont","Fonte do texto",SEL,FO],["radius","Arredondamento dos cartões (px)","num"],["maxw","Largura máxima do site (px)","num"],["bg","Fundo animado",SEL,BGS],["bgSpeed","Velocidade do fundo",SEL,LVL],["bgDensity","Quantidade de elementos do fundo",SEL,LVL]]},
 {id:"inicio",label:"Início",fields:[["tag","Selo do topo"],["title","Título"],["hi","Título em destaque"],["lead","Texto de apoio",AR],["b1","Botão 1: texto"],["u1","Botão 1: link (ex.: #obras)"],["b2","Botão 2: texto"],["u2","Botão 2: link"],["cards","Mostrar cartões das categorias",CK]]},
 {id:"cats",label:"Categorias",cats:true},
 {id:"blocos",label:"Blocos",blocks:true},
 {id:"rodape",label:"Menu e rodapé",fields:[["brand","Nome do portfólio"],["navHome","Nome da página inicial no menu"],["footer","Texto do rodapé"]],list:"links",noun:"link",item:[["label","Texto"],["url","Endereço (https://...)"]]},
 {id:"users",label:"Logins",fields:[["loginOn","Mostrar o botão de login com Google no site",CK],["loginLabel","Texto do botão"],["gate","Aviso para contas ainda não ativadas",AR]],users:true},
 {id:"adv",label:"Avançado",fields:[["css","CSS personalizado (vale para o site inteiro)","tall"]]}];
let tab="site";const adm=$("#adm");
const mark=d=>{dirty=d;$('[data-a=save]').disabled=!d||saving;const s=$("#st");s.textContent=d?"● Alterações não salvas":"Tudo salvo";s.classList.toggle("d",d)};
function field(p,l,t,v,o){
  if(t===SEL){const nm=typeof o[0]?.[0]==="number";return`<label class="fld">${esc(l)}<select data-p="${p}" ${nm?'data-n="1"':""}>${o.map(([k,n])=>`<option value="${esc(k)}" ${String(k)===String(v)?"selected":""}>${esc(n)}</option>`).join("")}</select></label>`}
  if(t===CK)return`<label class="fld ck"><input type="checkbox" data-p="${p}" ${v?"checked":""}> ${esc(l)}</label>`;
  if(t===AR||t==="tall")return`<label class="fld">${esc(l)}<textarea data-p="${p}" rows="${t==="tall"?12:4}">${esc(v)}</textarea></label>`;
  if(t==="num")return`<label class="fld">${esc(l)}<input data-p="${p}" data-n="1" type="number" min="0" value="${esc(v||"")}"></label>`;
  return`<label class="fld">${esc(l)}<input data-p="${p}" type="${t===CL?"color":"text"}" value="${esc(v)}"></label>`}
const BF=i=>[["cat","Categoria",SEL,cfg.cats.map(k=>[k.id,k.name])],["title","Título (opcional)"],["text","Texto (opcional)",AR],["dims","Dimensões (ex.: 30x40 cm / 3000x4000 px)"],["price","Preço (ex.: R$ 150)"],["pub","Preço visível para todos (desmarcado = só contas ativadas)",CK],["url","Link do botão (opcional)"],["label","Texto do botão"],["span","Largura no portfólio",SEL,SPANS],["imgh","Altura da imagem em px (vazio = automática)","num"],["minh","Altura mínima do bloco em px","num"],["center","Centralizar texto",CK],["plain","Sem fundo/borda (texto solto)",CK]].map(([k,l,t,o])=>field(`b.${i}.${k}`,l,t,blocks[i][k],o)).join("");
function draw(){
  $("#tabs").innerHTML=TABS.map(t=>`<button role="tab" data-tab="${t.id}" aria-selected="${t.id===tab}">${t.label}</button>`).join("");
  const T=TABS.find(x=>x.id===tab);let h="";
  (T.fields||[]).forEach(([p,l,t,o])=>h+=field(p,l,t,p==="cards"||p==="loginOn"?get(cfg,p)!==false:get(cfg,p),o));
  if(T.list){const L=get(cfg,T.list);L.forEach((it,i)=>h+=`<div class="item"><div class="ih"><b>${esc(it.label||T.noun)}</b><span><button data-a="del" data-i="${i}">Remover</button></span></div>${T.item.map(([k,l])=>field(`${T.list}.${i}.${k}`,l,"",it[k])).join("")}</div>`);h+=`<button class="btn btn-line btn-sm" data-a="add">+ Adicionar ${T.noun}</button>`}
  if(T.cats){h=`<p class="hint">Cada categoria é uma página separada, com botão próprio no menu.</p>`;
    cfg.cats.forEach((k,i)=>h+=`<div class="item"><div class="ih"><b>${esc(k.name||"Categoria")}</b><span><button data-a="cup" data-i="${i}">↑</button><button data-a="cdn" data-i="${i}">↓</button><button data-a="cblk" data-i="${i}">Blocos</button><button data-a="cdel" data-i="${i}">Excluir</button></span></div>${[["name","Nome no menu"],["title","Título da página"],["desc","Descrição curta (cartão do início)"],["text","Texto da página (## subtítulo)",AR],["on","Visível no site",CK]].map(([f,l,t])=>field(`cats.${i}.${f}`,l,t,f==="on"?k.on!==false:k[f])).join("")}</div>`);
    h+=`<button class="btn btn-line btn-sm" data-a="cadd">+ Nova categoria</button>`}
  if(T.blocks){if(!cfg.cats.some(k=>k.id===curCat))curCat=cfg.cats[0]?.id;
    h=cfg.cats.length?`<label class="fld">Categoria<select data-cur="1">${cfg.cats.map(k=>`<option value="${esc(k.id)}" ${k.id===curCat?"selected":""}>${esc(k.name)}</option>`).join("")}</select></label>`:`<p class="hint">Crie uma categoria primeiro.</p>`;
    blocks.forEach((b,i)=>{if(b.cat!==curCat)return;h+=`<div class="item"><div class="ih"><b>${esc(b.title||"Bloco "+(i+1))}</b><span><button data-a="up" data-i="${i}">↑</button><button data-a="down" data-i="${i}">↓</button><button data-a="del" data-i="${i}">Remover</button></span></div>${b.img?`<img class="thumb" src="${esc(b.img)}" alt="">`:""}<label class="fld">Imagem (envie do seu aparelho)<input type="file" accept="image/*" data-up="${i}"></label>${b.img?`<button class="btn btn-line btn-sm" data-a="rmimg" data-i="${i}">Remover imagem</button>`:""}${BF(i)}</div>`});
    if(cfg.cats.length)h+=`<button class="btn btn-line btn-sm" data-a="addb">+ Adicionar bloco</button>`}
  if(T.users){h+='<p class="hint">Se desativar o login, o botão some para os visitantes. Para entrar mesmo assim, abra o site com #admin no final do endereço.</p><div id="ul"><p class="hint">Carregando…</p></div>';loadUsers()}
  $("#ab").innerHTML=h}
async function loadUsers(){
  try{const s=await fb.F.getDocs(fb.F.collection(fb.db,"pf_users")),r=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.lastLogin||"").localeCompare(a.lastLogin||""));
    if(tab==="users"&&$("#ul"))$("#ul").innerHTML=`<p class="hint">Quem entra com Google fica pendente até você ativar. Contas ativadas veem os preços marcados como restritos.</p><table>${r.map(u=>`<tr><td>${esc(u.name)}<br><span class="hint">${esc(u.email)}</span></td><td><button class="btn ${u.approved?"btn-main":"btn-line"} btn-sm" data-a="appr" data-id="${u.id}" data-v="${u.approved?0:1}">${u.approved?"Ativo":"Ativar"}</button></td></tr>`).join("")}</table>`}
  catch(e){if($("#ul"))$("#ul").innerHTML=`<p class="hint">Erro ao listar: ${esc(e.code||e.message)}. Confira o firestore.rules.</p>`}}
function openAdmin(){if(!isAdmin())return;adm.hidden=false;mark(dirty);draw()}
function closeAdmin(f){if(!f&&dirty&&!confirm("Há alterações não salvas. Fechar mesmo assim?"))return;adm.hidden=true;if(dirty||f){cfg=clone(saved);blocks=clone(savedBlocks);touched.clear();deleted.clear();mark(false);render()}}
async function save(){
  if(saving||!dirty||!fb||!isAdmin())return;
  if(!hexOk(cfg.primary)||!hexOk(cfg.secondary))return toast("Cor inválida.");
  const b=$('[data-a=save]');saving=true;b.disabled=true;b.textContent="Salvando…";const F=fb.F,db=fb.db;
  try{
    await F.setDoc(F.doc(db,"portfolio","config"),clone(cfg));
    for(const id of deleted){await F.deleteDoc(F.doc(db,"pf_blocks",id));await F.deleteDoc(F.doc(db,"pf_prices",id))}
    for(const [i,bk] of blocks.entries()){if(!touched.has(bk.id))continue;
      const {price,pub,...rest}=bk;rest.o=i;rest.hp=!!price&&pub===false;
      await F.setDoc(F.doc(db,"pf_blocks",bk.id),rest);
      if(price)await F.setDoc(F.doc(db,"pf_prices",bk.id),{v:price,pub:pub!==false});else await F.deleteDoc(F.doc(db,"pf_prices",bk.id));}
    touched.clear();deleted.clear();saved=clone(cfg);savedBlocks=clone(blocks);await loadPrices();saving=false;mark(false);toast("Salvo e publicado ✓");render();
  }catch(er){saving=false;mark(true);toast(er.code==="permission-denied"?"Firestore recusou: confira as regras e o e-mail do admin.":"Erro ao salvar: "+(er.code||er.message))}
  finally{b.textContent="Salvar e publicar"}}
async function shrink(f){const bm=await createImageBitmap(f),k=Math.min(1,1400/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);let q=.85,d;do{d=c.toDataURL("image/webp",q);q-=.1}while(d.length>850000&&q>.15);return d}
let rt;adm.addEventListener("input",e=>{
  const t=e.target,p=t.dataset.p;if(!p)return;let v=t.type==="checkbox"?t.checked:t.value;if(t.dataset.n)v=v===""?"":+v;
  if(p.startsWith("b.")){const[,i,k]=p.split(".");blocks[i][k]=v;touched.add(blocks[i].id)}else set(cfg,p,v);
  mark(true);clearTimeout(rt);rt=setTimeout(render,120)});
adm.addEventListener("change",async e=>{
  if(e.target.dataset.cur!=null){curCat=e.target.value;draw();return}const i=e.target.dataset.up;if(i==null||!e.target.files[0])return;
  try{blocks[i].img=await shrink(e.target.files[0]);touched.add(blocks[i].id);mark(true);render();draw()}catch(er){toast("Não foi possível usar essa imagem.")}});
adm.addEventListener("click",async e=>{
  const tb=e.target.closest("[data-tab]");if(tb){tab=tb.dataset.tab;draw();return}
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,i=+b.dataset.i,T=TABS.find(x=>x.id===tab);
  if(a==="close")return closeAdmin();if(a==="save")return save();
  if(a==="discard"){if(!dirty)return;cfg=clone(saved);blocks=clone(savedBlocks);touched.clear();deleted.clear();mark(false);render();draw();return toast("Alterações descartadas.")}
  if(a==="appr"){try{await fb.F.updateDoc(fb.F.doc(fb.db,"pf_users",b.dataset.id),{approved:b.dataset.v==="1"});toast(b.dataset.v==="1"?"Login ativado ✓":"Login desativado");loadUsers()}catch(er){toast("Erro: "+(er.code||er.message))}return}
  if(a==="cadd")cfg.cats.push({id:"c"+Math.random().toString(36).slice(2,8),name:"Nova categoria",title:"Nova categoria",desc:"",text:"",on:true});
  else if(a==="cup"&&i>0)[cfg.cats[i-1],cfg.cats[i]]=[cfg.cats[i],cfg.cats[i-1]];
  else if(a==="cdn"&&i<cfg.cats.length-1)[cfg.cats[i+1],cfg.cats[i]]=[cfg.cats[i],cfg.cats[i+1]];
  else if(a==="cblk"){curCat=cfg.cats[i].id;tab="blocos";draw();return}
  else if(a==="cdel"){const k=cfg.cats[i],n=blocks.filter(x=>x.cat===k.id).length;if(!confirm(`Excluir a categoria "${k.name}"${n?` e seus ${n} bloco(s)`:""}?`))return;blocks=blocks.filter(x=>{if(x.cat!==k.id)return true;deleted.add(x.id);return false});cfg.cats.splice(i,1)}
  else if(a==="addb"){const id=crypto.randomUUID();blocks.push({id,cat:curCat,title:"",text:"",img:"",dims:"",price:"",pub:true,url:"",label:"Abrir",span:4,imgh:"",minh:"",center:false,plain:false});touched.add(id)}
  else if(a==="up"||a==="down"){const d=a==="up"?-1:1;let j=i+d;while(blocks[j]&&blocks[j].cat!==blocks[i].cat)j+=d;if(!blocks[j])return;[blocks[j],blocks[i]]=[blocks[i],blocks[j]];touched.add(blocks[i].id).add(blocks[j].id)}
  else if(a==="rmimg"){blocks[i].img="";touched.add(blocks[i].id)}
  else if(a==="del"){if(!confirm("Remover este item?"))return;if(T.blocks){deleted.add(blocks[i].id);blocks.splice(i,1)}else get(cfg,T.list).splice(i,1)}
  else if(a==="add")get(cfg,T.list).push(Object.fromEntries(T.item.map(([k])=>[k,""])));
  else return;
  mark(true);render();draw()});
addEventListener("keydown",e=>{if(adm.hidden)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();save()}if(e.key==="Escape")closeAdmin()});
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
route();render();boot();
</script>
